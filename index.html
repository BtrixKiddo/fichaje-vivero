<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichaje Vivero</title>
<meta name="theme-color" content="#1b8a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== KIOSCO (pantalla del trabajador) ===== -->
<section id="kiosk" class="screen">
  <button id="gear" title="Administrador">&#9881;</button>
  <div id="rest">
    <div id="clock">--:--</div>
    <div id="restDate"></div>
    <svg id="restArt" viewBox="0 0 260 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="rotate(-10 109 104)">
        <rect x="34" y="54" width="150" height="100" rx="16" fill="#ffffff"/>
        <path d="M64 112 Q 64 80 104 80 Q 104 118 64 112 Z" fill="#1b8a3a"/>
        <path d="M70 108 L 98 86" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <rect x="116" y="90" width="52" height="9" rx="4.5" fill="#cfe8d6"/>
        <rect x="116" y="110" width="36" height="9" rx="4.5" fill="#cfe8d6"/>
      </g>
      <g class="waves" stroke="#ffffff" stroke-width="11" stroke-linecap="round" fill="none">
        <path class="w1" d="M196 76 a 30 30 0 0 1 0 48"/>
        <path class="w2" d="M210 62 a 46 46 0 0 1 0 76"/>
        <path class="w3" d="M224 48 a 62 62 0 0 1 0 104"/>
      </g>
    </svg>
    <div class="rest-text">Acerca tu tarjeta</div>
    <div id="tapHint" class="hidden">Toca la pantalla para activar</div>
    <div id="nfcWarn" class="hidden">Este navegador no soporta NFC.<br>Usa Chrome en Android.</div>
  </div>
</section>

<!-- ===== MODO PERSONAL (móvil de un solo trabajador) ===== -->
<section id="personal" class="screen">
  <button id="gear2" title="Administrador">&#9881;</button>
  <div id="pInner">
    <div id="pClock">--:--</div>
    <div id="pDate"></div>
    <img id="pPhoto" alt="">
    <div id="pName"></div>
    <div id="pStatus" class="pstatus"></div>
    <button id="pBtn" class="bigbtn">FICHAR</button>
  </div>
</section>

<!-- Overlay de resultado (común a kiosco y personal) -->
<div id="result" class="hidden">
  <img id="rPhoto" alt="">
  <div id="rName"></div>
  <div id="rMsg"></div>
  <div id="rTime"></div>
</div>

<!-- ===== LOGIN PIN ===== -->
<section id="adminLogin" class="screen">
  <h2 id="pinLabel">Introduce el PIN</h2>
  <div id="pinDots"></div>
  <div class="pinpad">
    <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
    <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
    <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
    <button id="pinCancel">&#10005;</button><button data-d="0">0</button><button id="pinDel">&#9003;</button>
    <button id="pinOk" class="wide">Entrar</button>
  </div>
</section>

<!-- ===== ADMIN ===== -->
<section id="admin" class="screen">
  <div id="adminNav">
    <button id="navAlta"><span class="ic">&#10133;</span><span>Alta</span></button>
    <button id="navCorr"><span class="ic">&#9998;</span><span>Corrección</span></button>
    <button id="navHoras"><span class="ic">&#9201;</span><span>Horas</span></button>
    <button id="navIncompletos"><span class="ic">&#9888;</span><span>Incompletos</span></button>
    <button id="navConsulta"><span class="ic">&#128269;</span><span>Consulta</span></button>
    <button id="navExport"><span class="ic">&#11015;</span><span>Exportar</span></button>
    <button id="navInteg"><span class="ic">&#128274;</span><span>Integridad</span></button>
    <button id="navPin"><span class="ic">&#9881;</span><span>Ajustes</span></button>
    <button id="navSalir" class="salir"><span class="ic">&#8592;</span><span>Salir</span></button>
  </div>
  <div id="adminBody"></div>
</section>

<div id="toast"></div>
<div id="printArea"></div>

<script src="app.js"></script>
</body>
</html>
